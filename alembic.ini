# ══════════════════════════════════════════════════════════════════
# Alembic Configuration — EGChat KYC/AML
# ══════════════════════════════════════════════════════════════════
[alembic]
# Ruta al directorio de migraciones
script_location = alembic

# Nombre del archivo de versiones
version_locations = alembic/versions

# Formato del nombre de archivo de versión
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Zona horaria para timestamps en nombres de archivo
timezone = UTC

# Truncar el mensaje del slug a este número de caracteres
truncate_slug_length = 40

# URL de la base de datos — se sobreescribe en env.py con variable de entorno
sqlalchemy.url = postgresql+psycopg2://%(DB_USER)s:%(DB_PASSWORD)s@%(DB_HOST)s:%(DB_PORT)s/%(DB_NAME)s

# Comparación de tipos al autogenerar
compare_type = true
compare_server_default = true

[post_write_hooks]
# hooks opcionales (ej. black formatter)
# hooks = black
# black.type = console_scripts
# black.entrypoint = black

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
