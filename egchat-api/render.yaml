services:
  - type: web
    name: egchat-api
    env: node
    plan: free
    buildCommand: npm install --production
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_VERSION
        value: "2.5.8"
