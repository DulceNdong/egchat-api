services:
  - type: web
    name: egchat-api
    env: node
    plan: free
    buildCommand: npm install --production
    startCommand: node index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ALLOWED_ORIGINS
        value: https://egchat-app.vercel.app,https://egchat-v2.vercel.app,http://localhost:3001,http://localhost:5173
      - key: JWT_SECRET
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
