# Render auto-detect configuration
# Este archivo fuerza a Render a usar la configuración correcta

services:
  - type: web
    name: egchat-api
    env: node
    plan: free
    rootDir: .
    buildCommand: npm install --production
    startCommand: node index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: APP_VERSION
        value: "2.6.3-FORCE-DEPLOY"
